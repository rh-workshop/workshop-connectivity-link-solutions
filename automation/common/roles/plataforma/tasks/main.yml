---
- name: Comprobar la propiedad de la plataforma antes de cualquier escritura
  ansible.builtin.include_role:
    name: comun
    tasks_from: validar_gestor
  vars:
    plataforma_escritura_solicitada: "{{ not plataforma_verificar_solo | bool }}"

# Plataforma del taller (lo que hace el instructor una vez por clúster).
# - plataforma_verificar_solo=true : solo lectura; falla si falta algo.
# - plataforma_verificar_solo=false: crea lo que FALTE; lo existente (Istio con
#   meshConfig del Lab 5, Kuadrant con observability, Subscriptions) se detecta
#   y se deja intacto. Nada se reemplaza ni se borra.

- name: Filtrar los operadores que aplican a este proveedor de Gateway API
  ansible.builtin.set_fact:
    plataforma_operadores_activos: >-
      {{ plataforma_operadores
         | rejectattr('solo_si_gateway_class', 'defined')
         | list
         + (plataforma_operadores
            | selectattr('solo_si_gateway_class', 'defined')
            | selectattr('solo_si_gateway_class', 'equalto', gateway_class)
            | list) }}

- name: Instalar lo que falte de la plataforma
  ansible.builtin.include_tasks: instalar.yml
  when: not plataforma_verificar_solo | bool

- name: Verificar la plataforma
  ansible.builtin.import_tasks: verificar.yml
