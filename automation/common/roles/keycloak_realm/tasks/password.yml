---
# Contraseña de un usuario de demostración, sin cambios espurios:
# - keycloak_user no puede leer una contraseña y solo envía credentials cuando
#   detecta otra diferencia; por eso se comprueba antes con un password grant.
# - Si el login falla, se fija con el endpoint reset-password de la API de
#   administración (no hay módulo keycloak_* que lo haga sin recrear el usuario).
- name: "Comprobar si {{ kc_usuario.username }} inicia sesión con su contraseña"
  ansible.builtin.uri:
    url: "{{ wk_keycloak_issuer }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      client_id: connectivity-link
      grant_type: password
      username: "{{ kc_usuario.username }}"
      password: "{{ keycloak_usuarios_password[kc_usuario.username] }}"
    validate_certs: "{{ keycloak_validate_certs }}"
    status_code: [200, 400, 401]
  register: kc_login
  no_log: true

- name: "Fijar la contraseña de {{ kc_usuario.username }}"
  when: kc_login.status != 200
  block:
    - name: "Obtener el id de {{ kc_usuario.username }}"
      community.general.keycloak_user:
        realm: "{{ wk_realm }}"
        username: "{{ kc_usuario.username }}"
        email: "{{ kc_usuario.email }}"
        first_name: "{{ kc_usuario.first_name }}"
        last_name: "{{ kc_usuario.last_name }}"
        email_verified: true
        enabled: true
        state: present
      register: kc_user

    - name: Pedir un token de administración al realm master
      ansible.builtin.uri:
        url: "{{ wk_keycloak_url }}/realms/{{ keycloak_admin_realm }}/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: admin-cli
          grant_type: password
          username: "{{ wk_kc_admin_usuario }}"
          password: "{{ wk_kc_admin_password }}"
        validate_certs: "{{ keycloak_validate_certs }}"
      register: kc_admin_token
      no_log: true

    - name: "Restablecer la contraseña de {{ kc_usuario.username }}"
      ansible.builtin.uri:
        url: "{{ wk_keycloak_url }}/admin/realms/{{ wk_realm }}/users/{{ kc_user.end_state.id }}/reset-password"
        method: PUT
        headers:
          Authorization: "Bearer {{ kc_admin_token.json.access_token }}"
        body_format: json
        body:
          type: password
          value: "{{ keycloak_usuarios_password[kc_usuario.username] }}"
          temporary: false
        validate_certs: "{{ keycloak_validate_certs }}"
        status_code: 204
      changed_when: true
      no_log: true
