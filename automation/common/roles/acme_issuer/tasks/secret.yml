---
- name: Validar el gestor antes del bootstrap de Secret
  ansible.builtin.include_role:
    name: comun
    tasks_from: validar_gestor
  vars:
    plataforma_escritura_solicitada: false

# Excepción de bootstrap: solo el Secret, nunca el ClusterIssuer GitOps.
- name: Exigir bootstrap explícito para credenciales DNS
  ansible.builtin.assert:
    that: acme_issuer_participant_mode | default(false) | bool or acme_issuer_secret_bootstrap | bool or not acme_issuer_verificar_solo | bool
    fail_msg: Activa acme_issuer_secret_bootstrap para preparar el Secret.
    quiet: true

- name: Comprobar credenciales Route53 aportadas desde vault
  ansible.builtin.assert:
    that:
      - dns_provider_datos is mapping
      - dns_provider_datos.AWS_ACCESS_KEY_ID | default('') | length > 0
      - dns_provider_datos.AWS_SECRET_ACCESS_KEY | default('') | length > 0
      - dns_provider_datos.AWS_REGION | default('') | length > 0
    quiet: true
  no_log: true

- name: Leer únicamente la identidad del Secret existente
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ acme_secret_nombre }}"
    namespace: "{{ acme_secret_namespace }}"
  register: acme_secret_previo
  no_log: true

- name: Rechazar credenciales existentes sin propiedad explícita del rol
  ansible.builtin.assert:
    that: >-
      acme_secret_previo.resources | length == 0 or
      ((acme_secret_previo.resources[0].metadata.labels | default({})).get('workshop.module', '') == 'connectivity-link'
       and (acme_secret_previo.resources[0].metadata.labels | default({})).get('workshop.component', '') == 'acme-issuer')
    fail_msg: El Secret existe sin propiedad ACME explícita; no se adopta ni sobrescribe.
    quiet: true
  no_log: true

- name: Impedir rotación o adopción de credenciales de otro participante
  ansible.builtin.assert:
    that: >-
      acme_secret_previo.resources | length == 0 or
      ((acme_secret_previo.resources[0].metadata.labels | default({})).get('workshop.user', '') == lab_id
       and (acme_secret_previo.resources[0].metadata.annotations | default({})).get('argocd.argoproj.io/tracking-id', '') == ''
       and acme_secret_previo.resources[0].data == (lookup('ansible.builtin.template', 'secret.yaml.j2') | from_yaml).data)
    quiet: true
  when: acme_issuer_participant_mode | default(false) | bool
  no_log: true

- name: Exigir el Secret propio existente durante la verificación del participante
  ansible.builtin.assert:
    that: acme_secret_previo.resources | length == 1
    quiet: true
  when:
    - acme_issuer_participant_mode | default(false) | bool
    - acme_issuer_verificar_solo | bool
  no_log: true

- name: Reconciliar únicamente el Secret ACME propio
  ansible.builtin.include_role:
    name: comun
    tasks_from: asegurar_recurso
  vars:
    recurso_definicion: "{{ lookup('ansible.builtin.template', 'secret.yaml.j2') | from_yaml }}"
    recurso_actualizar_gestionado: true
    recurso_sensible: true
  no_log: true
  when:
    - acme_issuer_secret_bootstrap | bool or not acme_issuer_verificar_solo | bool
    - not acme_issuer_participant_mode | default(false) | bool or acme_secret_previo.resources | length == 0
