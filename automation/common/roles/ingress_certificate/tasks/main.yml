---
- name: Exigir un modo TLS explícito y validez mínima de siete días
  ansible.builtin.assert:
    that:
      - ingress_certificate_mode in ['verify', 'issue', 'apply', 'rollback']
      - ingress_certificate_min_days | int >= 7
      - ingress_certificate_mode not in ['apply', 'rollback'] or ingress_certificate_backup | length > 0
      - ingress_certificate_namespace == 'openshift-ingress'
    fail_msg: Usa verify/issue/apply/rollback; apply/rollback requieren backup privado externo.
    quiet: true

- name: Validar propiedad antes de cualquier escritura TLS
  ansible.builtin.include_role:
    name: comun
    tasks_from: validar_gestor
  vars:
    plataforma_escritura_solicitada: >-
      {{ ingress_certificate_mode != 'verify'
         and not (ingress_certificate_mode in ['apply', 'rollback'] and ingress_certificate_transicion | bool) }}

- name: Leer el dominio real de Ingress (sin overrides de inventario)
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: ingress_tls_config

- name: Leer identidad estable del clúster para el backup
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: kube-system
  register: ingress_tls_cluster

- name: Exigir una identidad única del clúster y dominio Ingress
  ansible.builtin.assert:
    that:
      - ingress_tls_config.resources | length == 1
      - ingress_tls_cluster.resources | length == 1
    quiet: true

- name: Fijar el dominio exacto de Ingress
  ansible.builtin.set_fact:
    ingress_domain: "{{ ingress_tls_config.resources[0].spec.domain }}"
    ingress_tls_uid: "{{ ingress_tls_cluster.resources[0].metadata.uid }}"

- name: Leer únicamente el IngressController que recibirá la referencia
  kubernetes.core.k8s_info:
    api_version: operator.openshift.io/v1
    kind: IngressController
    name: default
    namespace: openshift-ingress-operator
  register: ingress_tls_controller

- name: Emitir el certificado mediante la fuente canónica
  ansible.builtin.include_tasks: issue.yml
  when: ingress_certificate_mode == 'issue'

- name: Validar certificado antes de verificar o cambiar la referencia
  ansible.builtin.include_tasks: validar_tls.yml
  when: ingress_certificate_mode != 'rollback'

- name: Guardar estado original y cambiar exclusivamente defaultCertificate
  ansible.builtin.include_tasks: apply.yml
  when: ingress_certificate_mode == 'apply'

- name: Restaurar exclusivamente la referencia original desde backup
  ansible.builtin.include_tasks: rollback.yml
  when: ingress_certificate_mode == 'rollback'

- name: Verificar operadores y HTTPS servido después del cambio
  ansible.builtin.include_tasks: verificar_servicio.yml
  when:
    - ingress_certificate_mode in ['verify', 'apply', 'rollback']
    - ingress_certificate_verificar_servicio | bool
