---
# La DNSPolicy solo resuelve providerRefs en SU namespace: el Secret del
# proveedor debe existir en gateway-<lab_id>. Dos fuentes, por orden:
#   1. dns_provider_datos (dict, desde ansible-vault o variables de entorno)
#   2. copia del Secret de dns_provider_secret_origen_namespace
- name: Leer el Secret DNS de origen
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ dns_provider_secret }}"
    namespace: "{{ dns_provider_secret_origen_namespace }}"
  register: tenant_dns_origen
  no_log: true
  when:
    - dns_provider_datos is not defined
    - dns_provider_secret_origen_namespace != wk_ns_gateway

- name: Comprobar que hay credenciales DNS de donde partir
  ansible.builtin.assert:
    that: >-
      dns_provider_datos is defined or dns_provider_secret_origen_namespace == wk_ns_gateway
      or tenant_dns_origen.resources | default([]) | length > 0
    fail_msg: >-
      No hay Secret {{ dns_provider_secret }} en {{ dns_provider_secret_origen_namespace }} ni
      variable dns_provider_datos. Define una de las dos (ver README, «Secretos»).
    quiet: true

- name: Crear el Secret del proveedor DNS en el namespace del Gateway
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ k8s_field_manager }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ dns_provider_secret }}"
        namespace: "{{ wk_ns_gateway }}"
        labels: "{{ wk_labels }}"
      type: "{{ dns_provider_tipo }}"
      data: >-
        {{ (dns_provider_datos | dict2items | map(attribute='key')
            | zip(dns_provider_datos | dict2items | map(attribute='value') | map('b64encode')) | community.general.dict)
           if dns_provider_datos is defined else tenant_dns_origen.resources[0].data }}
  no_log: true
  when: dns_provider_datos is defined or dns_provider_secret_origen_namespace != wk_ns_gateway
