---
- name: Validar el gestor en la excepción explícita de bootstrap
  ansible.builtin.include_role:
    name: comun
    tasks_from: validar_gestor
  vars:
    plataforma_escritura_solicitada: false

- name: Exigir bootstrap explícito antes de instalar GitOps
  ansible.builtin.assert:
    that: not gitops_bootstrap_verificar_solo | bool
    fail_msg: El bootstrap solo verifica por defecto; autoriza la instalación explícitamente.
    quiet: true

- name: Buscar OperatorGroups en el namespace de bootstrap
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ gitops_bootstrap_operador.namespace }}"
  register: gitops_bootstrap_ogs

- name: Preservar únicamente un OperatorGroup global compatible
  ansible.builtin.assert:
    that:
      - gitops_bootstrap_ogs.resources | length <= 1
      - >-
        gitops_bootstrap_ogs.resources | length == 0 or
        (gitops_bootstrap_ogs.resources[0].spec.targetNamespaces | default([]) | length == 0
         and gitops_bootstrap_ogs.resources[0].spec.selector | default({}) | length == 0)
    fail_msg: El OperatorGroup GitOps existente es ambiguo o no es global; no se modifica.
    quiet: true

- name: Crear los recursos OLM ausentes sin tocar el OperatorGroup existente
  ansible.builtin.include_role:
    name: comun
    tasks_from: asegurar_recurso
  vars:
    recurso_definicion: "{{ recurso_gitops }}"
  loop: >-
    {{ [ {'apiVersion': 'v1', 'kind': 'Namespace',
          'metadata': {'name': gitops_bootstrap_operador.namespace}} ]
       + ([ {'apiVersion': 'operators.coreos.com/v1', 'kind': 'OperatorGroup',
             'metadata': {'name': gitops_bootstrap_operador.namespace,
                          'namespace': gitops_bootstrap_operador.namespace}, 'spec': {}} ]
          if gitops_bootstrap_ogs.resources | length == 0 else [])
       + [ {'apiVersion': 'operators.coreos.com/v1alpha1', 'kind': 'Subscription',
            'metadata': {'name': gitops_bootstrap_operador.nombre,
                         'namespace': gitops_bootstrap_operador.namespace},
            'spec': {'channel': gitops_bootstrap_operador.canal,
                     'name': gitops_bootstrap_operador.nombre, 'source': 'redhat-operators',
                     'sourceNamespace': 'openshift-marketplace', 'installPlanApproval': 'Automatic'}} ] }}
  loop_control:
    loop_var: recurso_gitops
    label: "{{ recurso_gitops.kind }}/{{ recurso_gitops.metadata.name }}"
