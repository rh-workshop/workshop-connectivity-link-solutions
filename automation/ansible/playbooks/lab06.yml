---
# Lab 6 · GitOps con Argo CD: la RateLimitPolicy del Lab 4A gestionada desde Git.
#   Prerrequisitos que importa (idempotentes): tenant, keycloak_realm, lab03, lab04a.
#   Por defecto usa un repo Git efímero dentro del clúster (sin credenciales);
#   con el repo del participante:
#     -e lab06_git_modo=externo -e lab06_git_repo_url=https://github.com/<org>/<repo>.git
#     [-e lab06_git_push=true + lab06_git_usuario/lab06_git_token desde vault]
- name: Lab 6 · GitOps con Argo CD
  hosts: localhost
  gather_facts: false
  roles:
    - role: comun
      tags: [always]
    - role: tenant
      tags: [tenant]
      tenant_validar: false
    - role: keycloak_realm
      tags: [keycloak]
      keycloak_realm_validar: false
    - role: lab03
      tags: [lab03]
      lab03_validar: false
    - role: lab04a
      tags: [lab04a]
      lab04a_validar: false
    - role: lab06
      tags: [lab06]
