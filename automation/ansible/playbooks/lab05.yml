---
# Lab 5 · Observabilidad: métricas, trazas, access logs y dashboards.
#   Prerrequisitos que importa (idempotentes): tenant, keycloak_realm, lab03, lab04a.
#   La plataforma de observabilidad (Tempo, colector, Grafana, meshConfig…) solo se
#   verifica; con -e lab05_plataforma_verificar_solo=false se crea lo que falte.
- name: Lab 5 · Observar el tráfico
  hosts: localhost
  gather_facts: false
  roles:
    - role: comun
      tags: [always]
    - role: tenant
      tags: [tenant]
      tenant_validar: false
    - role: keycloak_realm
      tags: [keycloak]
      keycloak_realm_validar: false
    - role: lab03
      tags: [lab03]
      lab03_validar: false
    - role: lab04a
      tags: [lab04a]
      lab04a_validar: false
    - role: lab05
      tags: [lab05]
