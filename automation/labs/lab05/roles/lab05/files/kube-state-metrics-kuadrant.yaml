apiVersion: v1
data:
  custom-resource-state.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind:
            group: gateway.networking.k8s.io
            kind: "Gateway"
            version: "v1beta1"
          metricNamePrefix: gatewayapi_gateway
          labelsFromPath:
            name:
              - metadata
              - name
            namespace:
              - metadata
              - namespace
          metrics:
            - name: "info"
              help: "Gateway information"
              each:
                type: Info
                info:
                  labelsFromPath:
                    gatewayclass_name: [spec, gatewayClassName]
            - name: "labels"
              help: "Kubernetes labels converted to Prometheus labels."
              each:
                type: Info
                info:
                  path: [metadata]
                  labelsFromPath:
                    service:
                      - labels
                      - service
                    deployment:
                      - labels
                      - deployment
            - name: "created"
              help: "created timestamp"
              each:
                type: Gauge
                gauge:
                  path: [metadata, creationTimestamp]
                info:
                  labelsFromPath: null
            - name: "deleted"
              help: "deletion timestamp"
              each:
                type: Gauge
                gauge:
                  path: [metadata, deletionTimestamp]
                info:
                  labelsFromPath: null
            - name: "listener_info"
              help: "Gateway listener information"
              each:
                type: Info
                info:
                  path: [spec, listeners]
                  labelsFromPath:
                    listener_name: ["name"]
                    port: ["port"]
                    protocol: ["protocol"]
                    hostname: ["hostname"]
                    tls_mode: ["tls", "mode"]
                    allowed_routes_namespaces_from: ["allowedRoutes", "namespaces", "from"]
            - name: "status"
              help: "status condition"
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    type: ["type"]
                  valueFrom: ["status"]
                info:
                  labelsFromPath: null
            - name: "status_listener_attached_routes"
              help: "Number of attached routes for a listener"
              each:
                type: Gauge
                gauge:
                  path: [status, listeners]
                  labelsFromPath:
                    listener_name: ["name"]
                  valueFrom: ["attachedRoutes"]
                info:
                  labelsFromPath: null
            - name: "status_address_info"
              help: "Gateway address types and values"
              each:
                type: Info
                info:
                  path: [status, addresses]
                  labelsFromPath:
                    type: ["type"]
                    value: ["value"]
        - groupVersionKind:
            group: gateway.networking.k8s.io
            kind: "GatewayClass"
            version: "v1beta1"
          metricNamePrefix: gatewayapi_gatewayclass
          labelsFromPath:
            name:
              - metadata
