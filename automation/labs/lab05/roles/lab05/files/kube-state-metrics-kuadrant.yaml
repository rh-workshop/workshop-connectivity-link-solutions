# kube-state-metrics con custom-resource-state para Gateway API y las políticas
# de Connectivity Link (métricas gatewayapi_* de los dashboards de Grafana).
# Exportado del clúster validado (lab5.adoc, procedimiento del instructor, paso 4):
# kustomize upstream de kuadrant-operator v1.2.0 reducido a estas piezas, con
# --custom-resource-state-only=true, RBAC ampliado (endpointslices, dnsrecords,
# dnshealthcheckprobes) y etiquetas _labels acotadas a service/deployment.
# IMAGEN_KSM se sustituye por la imagen kube-state-metrics del propio clúster.
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics-kuadrant
    app.kubernetes.io/part-of: kuadrant
    app.kubernetes.io/version: 2.5.0
  name: kube-state-metrics-kuadrant
  namespace: rhcl-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
