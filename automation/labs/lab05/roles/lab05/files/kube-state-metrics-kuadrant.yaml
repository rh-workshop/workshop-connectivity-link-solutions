              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    type: ["type"]
                  valueFrom: ["status"]
                info:
                  labelsFromPath: null
            - name: "status_supported_features"
              help: "List of supported features for the GatewayClass"
              each:
                type: Info
                info:
                  path: [status, supportedFeatures]
                  labelsFromPath:
                    features: []
        - groupVersionKind:
            group: gateway.networking.k8s.io
