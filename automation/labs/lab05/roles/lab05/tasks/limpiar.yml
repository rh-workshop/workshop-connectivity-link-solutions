---
# Limpieza del Lab 5 (lab5.adoc, «Limpieza»): solo lo del participante. La
# plataforma de observabilidad es compartida y no se toca nunca desde aquí.
- name: Borrar la Telemetry de access logs del Gateway
  kubernetes.core.k8s:
    state: absent
    api_version: telemetry.istio.io/v1
    kind: Telemetry
    name: "{{ lab05_telemetry_nombre }}"
    namespace: "{{ wk_ns_gateway }}"
    wait: true

- name: Comprobar si la HTTPRoute del Lab 4A sigue existiendo
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: "api-route-{{ lab_id }}"
    namespace: "{{ wk_ns_app }}"
  register: lab05_ruta

# Aplicar el objeto SIN las etiquetas con el mismo field manager las retira:
# el manager del Lab 5 era su único dueño. El resto de la ruta no se toca.
- name: Quitar las etiquetas service/deployment de la HTTPRoute
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ lab05_field_manager }}"
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: "api-route-{{ lab_id }}"
        namespace: "{{ wk_ns_app }}"
  when: lab05_ruta.resources | length > 0
