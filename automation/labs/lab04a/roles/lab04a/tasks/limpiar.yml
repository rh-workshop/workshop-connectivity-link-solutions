---
- name: Borrar RateLimitPolicy, HTTPRoute y backend bank-api
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.v }}"
    kind: "{{ item.k }}"
    name: "{{ item.n }}"
    namespace: "{{ wk_ns_app }}"
    wait: true
  loop:
    - {v: kuadrant.io/v1, k: RateLimitPolicy, n: "api-route-rl-{{ lab_id }}"}
    - {v: gateway.networking.k8s.io/v1, k: HTTPRoute, n: "api-route-{{ lab_id }}"}
    - {v: apps/v1, k: Deployment, n: bank-api}
    - {v: v1, k: Service, n: bank-api}
  loop_control:
    label: "{{ item.k }}/{{ item.n }}"
