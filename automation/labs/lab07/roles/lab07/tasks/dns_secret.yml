---
# Secret del proveedor DNS de la zona pública (lab7-cloud.adoc, paso 4). La
# DNSPolicy solo lo encuentra en SU namespace. Nunca se escribe un valor en el
# repo: vault (lab07_dns_provider_datos o dns_provider_datos) o copia del Secret
# que ya preparó el instructor.
- name: Elegir la fuente de las credenciales DNS de la nube
  ansible.builtin.set_fact:
    lab07_dns_datos: "{{ lab07_dns_provider_datos if lab07_dns_provider_datos is defined else dns_provider_datos }}"
  no_log: true
  when: lab07_dns_provider_datos is defined or dns_provider_datos is defined

- name: Leer el Secret DNS de origen
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ lab07_dns_secret_origen }}"
    namespace: "{{ lab07_dns_secret_origen_namespace }}"
  register: lab07_dns_origen
  no_log: true
  when: lab07_dns_datos is not defined

- name: Comprobar que hay credenciales DNS de donde partir
  ansible.builtin.assert:
    that: lab07_dns_datos is defined or lab07_dns_origen.resources | default([]) | length > 0
    fail_msg: >-
      No hay Secret {{ lab07_dns_secret_origen }} en {{ lab07_dns_secret_origen_namespace }} ni variable
      lab07_dns_provider_datos / dns_provider_datos (vault) con las credenciales de la zona {{ lab07_zona }}.
    quiet: true

- name: Crear el Secret {{ lab07_dns_secret }} en el namespace del Gateway
  kubernetes.core.k8s:
    state: present
    apply: true
    server_side_apply:
      field_manager: "{{ k8s_field_manager }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ lab07_dns_secret }}"
        namespace: "{{ wk_ns_gateway }}"
        labels: "{{ wk_labels }}"
      type: "{{ lab07_dns_tipo }}"
      data: >-
        {{ (lab07_dns_datos | dict2items | map(attribute='key')
            | zip(lab07_dns_datos | dict2items | map(attribute='value') | map('b64encode')) | community.general.dict)
           if lab07_dns_datos is defined else lab07_dns_origen.resources[0].data }}
  no_log: true
