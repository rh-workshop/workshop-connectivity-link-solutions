---
- name: Retirar únicamente el rol temporal registrado por el Lab 8
  ansible.builtin.import_tasks: restaurar_rol.yml

- name: Borrar políticas, ruta, ServiceEntry y Service del inventario
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.v }}"
    kind: "{{ item.k }}"
    name: "{{ item.n }}"
    namespace: "{{ wk_ns_app }}"
    wait: true
  loop:
    - {v: kuadrant.io/v1, k: AuthPolicy, n: "inventario-auth-{{ lab_id }}"}
    - {v: kuadrant.io/v1, k: RateLimitPolicy, n: "inventario-rl-{{ lab_id }}"}
    - {v: gateway.networking.k8s.io/v1, k: HTTPRoute, n: "inventario-route-{{ lab_id }}"}
    - {v: networking.istio.io/v1, k: ServiceEntry, n: inventario-externo}
    - {v: v1, k: Service, n: inventario-externo}
  loop_control:
    label: "{{ item.k }}/{{ item.n }}"
