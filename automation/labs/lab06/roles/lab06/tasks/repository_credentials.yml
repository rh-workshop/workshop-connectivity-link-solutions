---
# Este tag ejecuta sólo comun (guardas de destino) y estas tareas.
- name: Validar el perfil SSH explícito sin registrar la clave
  ansible.builtin.assert:
    that:
      - lab06_git_modo == 'externo'
      - lab06_git_repo_url is match('^git@github[.]com:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+[.]git$')
      - lab06_repository_credentials_name == 'lab06-repository-' ~ lab_id
      - lab06_repository_ssh_private_key is string
      - lab06_repository_ssh_private_key.startswith('-----BEGIN OPENSSH PRIVATE KEY-----')
      - lab06_repository_ssh_private_key.rstrip().endswith('-----END OPENSSH PRIVATE KEY-----')
    quiet: true
  no_log: true

- name: Verificar la instancia GitOps existente sin bootstrap
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    name: "{{ lab06_argocd_instancia }}"
    namespace: "{{ lab06_argocd_namespace }}"
  register: lab06_repository_argocd

- name: Exigir la instancia preparada por el instructor
  ansible.builtin.assert:
    that:
      - lab06_repository_argocd.resources | length == 1
      - lab06_repository_argocd.resources[0].status.phase | default('') == 'Available'
    quiet: true

- name: Leer las claves de host ya configuradas por el operador
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: argocd-ssh-known-hosts-cm
    namespace: "{{ lab06_argocd_namespace }}"
  register: lab06_repository_known_hosts

- name: Exigir la clave pública de GitHub sin alterar configuración global
  ansible.builtin.assert:
    that:
      - lab06_repository_known_hosts.resources | length == 1
      - lab06_repository_known_hosts.resources[0].data['ssh_known_hosts'] | regex_search('(?m)^github[.]com (?:ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa) ')
    quiet: true

- name: Leer el Secret de repositorio con salida privada
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ lab06_repository_credentials_name }}"
    namespace: "{{ lab06_argocd_namespace }}"
  register: lab06_repository_secret
  no_log: true

- name: Rechazar credenciales ajenas o diferentes antes de escribir
  ansible.builtin.assert:
    that:
      - lab06_repository_secret.resources | length <= 1
      - >-
        lab06_repository_secret.resources | length == 0 or
        (lab06_repository_secret.resources[0].metadata.labels | default({})).get('workshop.user') == lab_id and
        (lab06_repository_secret.resources[0].metadata.labels | default({})).get('workshop.component') == 'lab06-repository' and
        (lab06_repository_secret.resources[0].metadata.labels | default({})).get('argocd.argoproj.io/secret-type') == 'repository' and
        lab06_repository_secret.resources[0].type == 'Opaque' and
        lab06_repository_secret.resources[0].data.keys() | sort == ['sshPrivateKey', 'type', 'url'] and
        lab06_repository_secret.resources[0].data.url | b64decode == lab06_git_repo_url and
        lab06_repository_secret.resources[0].data.type | b64decode == 'git' and
        lab06_repository_secret.resources[0].data.sshPrivateKey | b64decode == lab06_repository_ssh_private_key
      - not lab06_repository_credentials_verify_only | bool or lab06_repository_secret.resources | length == 1
    quiet: true
  no_log: true

- name: Crear el Secret dedicado sólo con preparación explícita
  kubernetes.core.k8s:
    state: present
    template: repository-secret.yaml.j2
  when:
    - not lab06_repository_credentials_verify_only | bool
    - lab06_repository_secret.resources | length == 0
  no_log: true
