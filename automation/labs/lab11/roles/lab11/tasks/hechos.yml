---
# Nombres del Lab 11 y la IP pública del ejecutor (paso 1 del lab).
- name: Calcular los nombres del Gateway B2B
  ansible.builtin.set_fact:
    lab11_gateway: "b2b-gw-{{ lab_id }}"
    lab11_b2b_host: "b2b-{{ lab_id }}.{{ wk_zona }}"
    lab11_soc_host: "socios-{{ lab_id }}.{{ wk_zona }}"
    lab11_b2b_url: "https://b2b-{{ lab_id }}.{{ wk_zona }}/socio/v1/pedidos"
    lab11_soc_url: "https://socios-{{ lab_id }}.{{ wk_zona }}/socio/v1/pedidos"

- name: Detectar la IP pública del ejecutor
  ansible.builtin.uri:
    url: "{{ item }}"
    return_content: true
    status_code: [-1, 200]
    timeout: 10
  loop: "{{ lab11_urls_ip_publica }}"
  register: lab11_ip_detectada
  when: lab11_mi_ip | length == 0

- name: Fijar la IP pública (primera respuesta IPv4)
  ansible.builtin.set_fact:
    wk_lab11_ip: >-
      {{ lab11_mi_ip if lab11_mi_ip | length > 0 else
         (lab11_ip_detectada.results | selectattr('status', 'equalto', 200) | map(attribute='content') | map('trim')
          | select('match', '^(\d{1,3}\.){3}\d{1,3}$') | first | default('')) }}

- name: Exigir una IPv4 pública
  ansible.builtin.assert:
    that: wk_lab11_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
    fail_msg: >-
      No se obtuvo una IPv4 pública ('{{ wk_lab11_ip }}'). El filtrado del lab usa split(":")[0], solo
      válido en IPv4: pasa -e lab11_mi_ip=<tu IPv4 pública>.
    success_msg: "IP pública del ejecutor: {{ wk_lab11_ip }}"
